# Mosquitto 2.x for the pharma-4 UNS (ADR-0002). No TLS: out of scope for the POC.
listener 1883
allow_anonymous false

# Generated at container start from MQTT_PASSWORD_* by entrypoint.sh; never in git.
password_file /mosquitto/run/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Retained current state is the point of the UNS; keep memory bounded anyway.
max_queued_messages 10000
