# pharma-4 stack. `docker compose up` must reach demo-ready with no manual steps.
# Credentials: every container gets .env.example, then .env if present (see .env.example).

x-env: &env
  env_file:
    - path: .env.example
      required: true
    - path: .env
      required: false

# Every Python service: one image, a different module (architecture: service layout).
x-python: &python
  <<: *env
  build: .
  image: pharma-4:latest
  restart: unless-stopped
  stop_grace_period: 5s

x-python-env: &python-env
  MQTT_HOST: mosquitto
  POSTGRES_HOST: timescaledb
  BOLT_URI: bolt://neo4j:7687
  MODELS_DIR: /models

services:
  # One-shot first start: migrations, config, backfill, stock handover, training.
  # Idempotent; services that need its results wait for it to complete (ADR-0010).
  bootstrap:
    <<: *python
    restart: "no"
    command: ["python", "-m", "bootstrap.run"]
    environment:
      <<: *python-env
      SERVICE: bootstrap
    volumes:
      - models:/models
    depends_on:
      mosquitto: {condition: service_healthy}
      timescaledb: {condition: service_healthy}
      neo4j: {condition: service_healthy}

  historian:
    <<: *python
    command: ["python", "-m", "historian.writer"]
    environment:
      <<: *python-env
      SERVICE: historian
    depends_on:
      mosquitto: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}

  graph-sync:
    <<: *python
    command: ["python", "-m", "graph.sync"]
    environment:
      <<: *python-env
      SERVICE: graph-sync
    depends_on:
      mosquitto: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}

  anomaly:
    <<: *python
    command: ["python", "-m", "ai.anomaly.service"]
    environment:
      <<: *python-env
      SERVICE: anomaly
    volumes:
      - models:/models:ro
    depends_on:
      mosquitto: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}

  yield:
    <<: *python
    command: ["python", "-m", "ai.yield_.service"]
    environment:
      <<: *python-env
      SERVICE: yield
    volumes:
      - models:/models:ro
    depends_on:
      mosquitto: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}

  # i3X 1.0 read API over the broker, historian and graph (ADR-0016).
  # http://localhost:8600/v1/info; every other endpoint needs I3X_API_KEY.
  i3x:
    <<: *python
    command: ["python", "-m", "i3x.service"]
    environment:
      <<: *python-env
      SERVICE: i3x
    ports: ["8600:8600"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8600/v1/info', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mosquitto: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}

  simulator:
    <<: *python
    command: ["python", "-m", "simulator.run"]
    environment:
      <<: *python-env
      SERVICE: simulator
    depends_on:
      mosquitto: {condition: service_healthy}

  edge-adapter:
    <<: *python
    command: ["python", "-m", "edge.adapter"]
    environment:
      <<: *python-env
      SERVICE: edge-adapter
    depends_on:
      mosquitto: {condition: service_healthy}

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    <<: *env
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u healthcheck -P \"$$MQTT_PASSWORD_HEALTHCHECK\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 12

  timescaledb:
    image: timescale/timescaledb:2.29.2-pg16
    <<: *env
    ports: ["5432:5432"]
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 24

  neo4j:
    image: neo4j:5.26.31-community
    <<: *env
    environment:
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  dashboard:
    <<: *python
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      <<: *python-env
      SERVICE: dashboard
      HOME: /tmp  # streamlit writes its config under $HOME; the service user has none
      I3X_URL: http://i3x:8600/v1  # the Ask page reads the plant only through i3X (ADR-0017)
    ports: ["8501:8501"]
    volumes:
      - models:/models:ro
    depends_on:
      mosquitto: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}

volumes:
  models:
  mosquitto-data:
  timescale-data:
  neo4j-data:
