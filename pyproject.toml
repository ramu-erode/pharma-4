[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-4"
version = "0.1.0"
description = "Pharma 4.0 POC: bioreactor UNS, knowledge graph and AI"
requires-python = ">=3.12,<3.13"
# Dependencies live in requirements.txt (pinned); this file holds metadata and tool config.

[tool.setuptools.packages.find]
include = ["common*", "simulator*", "edge*", "historian*", "graph*", "ai*", "bootstrap*", "dashboard*", "i3x*", "assistant*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# UI copy: long sentences and the typographic ×, ≥ are intended.
"dashboard/*" = ["E501", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not compose'"
timeout = 120
markers = [
  "slow: in-process fault harness and other multi-second tests (run by default)",
  "compose: needs the running docker compose stack (pytest -m compose)",
]
