# Recipe asa-v1: aspirin API as transferred to Tuas (2025). Hot, anhydride-rich and
# fast-cooled: robust conversion, but it gives away yield to impurities and fines.
# Read by the simulator (nominal levers, jitter) and graph-sync (PARs, spec limits).
id: asa-v1
process: api
name: Acetylsalicylic acid API
version: 1
effective_from: 2025-01-01
nominal:
  rxn_temp: 88.0
  ac2o_ratio: 1.36
  rxn_time: 3.5
  cool_rate: 16.0
  dry_temp: 56.0
# Proven acceptable ranges: the optimizer's bounds. The same for every version.
par:
  rxn_temp: [80.0, 90.0]
  ac2o_ratio: [1.10, 1.40]
  rxn_time: [2.0, 4.0]
  cool_rate: [5.0, 20.0]
  dry_temp: [40.0, 60.0]
# Run-to-run standard deviation of each lever in manufacturing batches.
jitter:
  rxn_temp: 0.4
  ac2o_ratio: 0.012
  rxn_time: 0.08
  cool_rate: 0.5
  dry_temp: 0.8
# Spec limits on process values. `sp_relative` limits are offsets from the setpoint;
# `operations` limits a check to the operations where the value is controlled.
limits:
  temperature: {sp_relative: true, action: [-2.0, 2.0], alarm: [-4.0, 4.0], operations: [Reaction, Crystallization]}
  filter_pressure: {sp_relative: true, action: [-0.2, 0.2], alarm: [-0.4, 0.4], operations: [Filtration, Washing]}
  vacuum: {sp_relative: false, action: [0.0, 120.0], alarm: [0.0, 250.0], operations: [Drying]}
