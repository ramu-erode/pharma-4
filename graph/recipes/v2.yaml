# Recipe v2: first process improvement (2024): earlier, cooler shift; pH centred.
# Read by the simulator (nominal levers, jitter) and graph-sync (PARs, spec limits).
id: v2
name: CHO-mAb fed-batch
version: 2
effective_from: 2024-01-01
nominal:
  shift_day: 5.5
  prod_temp: 33.5
  ph_sp: 7.00
  do_sp: 40.0
  feed_mult: 1.0
# Proven acceptable ranges: the optimizer's bounds (ADR-0014). The same for every version.
par:
  shift_day: [4.0, 7.0]
  prod_temp: [32.0, 35.0]
  ph_sp: [6.90, 7.10]
  do_sp: [30.0, 50.0]
  feed_mult: [0.8, 1.2]
# Run-to-run standard deviation of each lever in manufacturing batches.
jitter:
  shift_day: 0.15
  prod_temp: 0.15
  ph_sp: 0.01
  do_sp: 1.5
  feed_mult: 0.03
# Spec limits on process values. `sp_relative` limits are offsets from the setpoint.
limits:
  temperature: {sp_relative: true, action: [-0.5, 0.5], alarm: [-1.0, 1.0]}
  ph: {sp_relative: true, action: [-0.10, 0.10], alarm: [-0.20, 0.20]}
  do: {sp_relative: false, action: [20.0, 105.0], alarm: [10.0, 110.0]}  # low density: DO rides above SP
  pressure: {sp_relative: false, action: [40.0, 110.0], alarm: [30.0, 130.0]}
