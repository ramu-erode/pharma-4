# Recipe tab-v1: aspirin 500 mg tablets as launched at Freiburg (2025). Long
# lubrication, hard compaction and a fast press: it runs, but loses tablets to capping
# and weight rejects.
# Read by the simulator (nominal levers, jitter) and graph-sync (PARs, spec limits).
id: tab-v1
process: osd
name: Acetylsalicylic acid 500 mg tablets
version: 1
effective_from: 2025-01-01
nominal:
  lube_time: 4.5
  roll_force: 8.6
  comp_force: 17.5
  turret_speed: 55.0
  feed_frame: 26.0
# Proven acceptable ranges: the optimizer's bounds. The same for every version.
par:
  lube_time: [2.0, 6.0]
  roll_force: [4.0, 10.0]
  comp_force: [10.0, 20.0]
  turret_speed: [30.0, 60.0]
  feed_frame: [20.0, 40.0]
# Run-to-run standard deviation of each lever in manufacturing batches.
jitter:
  lube_time: 0.1
  roll_force: 0.12
  comp_force: 0.25
  turret_speed: 0.8
  feed_frame: 0.6
# Spec limits on process values. `sp_relative` limits are offsets from the setpoint;
# `operations` limits a check to the operations where the value is controlled.
limits:
  roll_force: {sp_relative: true, action: [-0.5, 0.5], alarm: [-1.0, 1.0], operations: [Compaction]}
  comp_force: {sp_relative: true, action: [-1.5, 1.5], alarm: [-3.0, 3.0], operations: [Compression]}
  tablet_weight: {sp_relative: false, action: [585.0, 615.0], alarm: [570.0, 630.0], operations: [Compression]}
  weight_rsd: {sp_relative: false, action: [0.0, 2.5], alarm: [0.0, 4.0], operations: [Compression]}
  ejection_force: {sp_relative: false, action: [0.0, 550.0], alarm: [0.0, 700.0], operations: [Compression]}
  room_rh: {sp_relative: false, action: [0.0, 40.0], alarm: [0.0, 50.0]}
